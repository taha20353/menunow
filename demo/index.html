<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>المنيو</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#1d1a16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo" id="demoBar" hidden></div>

  <header class="top" id="top">
    <div class="top__bg" id="cover"></div>
    <div class="top__inner wrap">
      <div class="brand">
        <div class="brand__mark" id="logo" aria-hidden="true"></div>
        <div>
          <h1 class="brand__name" id="name"></h1>
          <p class="brand__tag" id="tagline"></p>
        </div>
      </div>
      <div class="chips-info" id="info"></div>
    </div>
  </header>

  <nav class="cats" id="catsBar" aria-label="أقسام المنيو">
    <div class="wrap cats__inner">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <input type="search" id="q" placeholder="ابحث في المنيو..." aria-label="ابحث في المنيو">
      </label>
      <div class="cats__list" id="cats" role="list"></div>
    </div>
  </nav>

  <main class="wrap" id="menu"></main>
  <p class="empty wrap" id="empty" hidden>مفيش صنف بالاسم ده.. جرّب كلمة تانية.</p>

  <footer class="foot wrap" id="foot"></footer>

  <button class="bag" id="bagBtn" hidden aria-label="طلبك">
    <span class="bag__count" id="bagCount">0</span>
    <span class="bag__label">طلبك</span>
    <span class="bag__total" id="bagTotal"></span>
  </button>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <section class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header class="sheet__head">
        <h2 id="sheetTitle">طلبك</h2>
        <button class="x" data-close aria-label="إغلاق">✕</button>
      </header>
      <ul class="lines" id="lines"></ul>
      <div class="sheet__form">
        <div class="seg" id="mode" role="radiogroup" aria-label="نوع الطلب"></div>
        <label class="field" id="tableField">رقم الترابيزة<input id="table" inputmode="numeric" maxlength="4"></label>
        <label class="field" id="addrField" hidden>العنوان بالتفصيل<input id="addr" autocomplete="street-address"></label>
        <label class="field">ملاحظات (اختياري)<input id="note" placeholder="مثلاً: من غير سكر"></label>
      </div>
      <footer class="sheet__foot">
        <div class="sum"><span>الإجمالي</span><strong id="sum"></strong></div>
        <p class="hint" id="feeHint"></p>
        <button class="btn-wa" id="send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
          ابعت الطلب على واتساب
        </button>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
